apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: kezek
  labels:
    app.kubernetes.io/name: booking
    app.kubernetes.io/part-of: kezek
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: booking
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking
        app.kubernetes.io/part-of: kezek
        app.kubernetes.io/version: "0.2.0"
    spec:
      containers:
        - name: booking
          image: booking:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # - name: metrics
            #   containerPort: 9090
